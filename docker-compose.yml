services:

  # ── PHP-FPM ─────────────────────────────────────────────────────────────────
  app:
    build:
      context: apps/laravel
      dockerfile: Dockerfile
    container_name: kamo_app
    restart: unless-stopped
    volumes:
      - ./apps/laravel:/var/www/html          # código fuente
      - storage_framework:/var/www/html/storage/framework  # sesiones/cache/vistas en volumen rápido
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: kamo_laravel
      DB_USERNAME: user
      DB_PASSWORD: user_password
      SESSION_DRIVER: cookie
      CACHE_STORE: file
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        mkdir -p /var/www/html/storage/framework/sessions &&
        mkdir -p /var/www/html/storage/framework/cache/data &&
        mkdir -p /var/www/html/storage/framework/views &&
        mkdir -p /var/www/html/storage/framework/testing &&
        mkdir -p /var/www/html/storage/logs &&
        mkdir -p /var/www/html/storage/app/public &&
        mkdir -p /var/www/html/bootstrap/cache &&
        chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache &&
        chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache &&
        php artisan optimize:clear &&
        php artisan migrate --force &&
        php artisan db:seed --force &&
        php-fpm
      "

  # ── Nginx ────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: kamo_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./apps/laravel:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # ── MySQL ────────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: kamo_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: kamo_laravel
      MYSQL_USER: user
      MYSQL_PASSWORD: user_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  storage_framework:    # volumen Docker nativo = sin overhead de Windows filesystem
